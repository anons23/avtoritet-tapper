name: JavaScript syntax and logic checks

on:
  push:
    branches:
      - fix/yandex-16plus-stability
  pull_request:
    branches:
      - fix/yandex-16plus-stability
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)

      - name: Run game logic tests
        run: node tests/game-invariants.test.js

      - name: Run rewarded ad lifecycle tests
        run: node tests/rewarded-ad-lifecycle.test.js
