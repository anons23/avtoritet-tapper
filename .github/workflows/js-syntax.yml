name: JavaScript syntax check

on:
  push:
    branches:
      - fix/yandex-16plus-stability
  pull_request:
    branches:
      - fix/yandex-16plus-stability
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)
