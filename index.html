<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Авторитет 2.0</title>
<link rel="stylesheet" href="./style.css?v=3.3">
<link rel="stylesheet" href="./pc-responsive.css?v=1.0">
<link rel="stylesheet" href="./object-visuals.css?v=1.0">
<link rel="stylesheet" href="./energy-ui.css?v=1.0">
<link rel="stylesheet" href="./npc-barrack.css?v=1.0">
<!-- Yandex Games SDK: required for publication, cloud saves and platform ads. -->
<script src="/sdk.js"></script>
<script src="./js/yandex-sdk.js?v=1.3"></script>
</head>
<body>
<div id="game-container">
<header id="top-bar"><div class="resource">🚬 <span id="cigarettes">0</span></div><div class="resource">⭐ <span id="points">0</span></div><div class="resource energy">⚡ <span id="energy">250</span>/<span id="max-energy">250</span></div></header>
<section id="player-info"><div id="nickname">Салага</div><div id="rank">Салага</div><div class="stats"><span>💪 <b id="power-stat">1</b></span><span>🧠 <b id="respect-stat">0</b></span><span>💰 <b id="wealth-stat">0</b></span></div></section>
<div id="jail-panel" class="hidden"><div class="jail-title">🔒 КАРЦЕР</div><div class="jail-counter"><b id="jail-count">0 / 500</b></div><div class="jail-text"><span id="jail-left">500</span> тапов до выхода из карцера</div><div class="jail-confiscated">🚬 Сигареты сохранены</div></div>
<main id="tap-area"><div id="tap-object" class="tap-target"><div id="object-emoji">🥊</div><div id="object-name">Груша</div><small>ТАПАЙ!</small></div><div id="tap-feedback"></div></main>
<div id="event-message"></div>
<footer id="bottom-bar"><button type="button" id="btn-shop" class="nav-btn">💪 Качалка</button><button type="button" id="btn-rank" class="nav-btn">🏆 Масть</button><button type="button" id="btn-tasks" class="nav-btn">🎯 Поручения</button><button type="button" id="btn-more" class="nav-btn">☰ Барак</button></footer>
<div id="modal-overlay" class="hidden"><div id="modal"><button type="button" id="modal-close">✕</button><div id="modal-content"></div></div></div>
</div>
<script src="./js/backgrounds-ui.js?v=1.0"></script>
<script defer src="./js/bootstrap.js?v=1.3"></script>
<script defer src="./js/energy-ui.js?v=1.0"></script>
</body>
</html>
