<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Авторитет 2.0</title>
<link rel="stylesheet" href="./style.css?v=3.9">
<link rel="stylesheet" href="./preloader.css?v=1.0">
<link rel="stylesheet" href="./pc-responsive.css?v=1.2">
<link rel="stylesheet" href="./object-visuals.css?v=6.1">
<link rel="stylesheet" href="./energy-ui.css?v=1.0">
<link rel="stylesheet" href="./npc-barrack.css?v=1.3">
<link rel="stylesheet" href="./npc-image-fix.css?v=1.5">
<link rel="stylesheet" href="./npc-motion.css?v=1.3">
<link rel="stylesheet" href="./npc-dialogue-modern.css?v=1.8">
<link rel="stylesheet" href="./stats-cleanup.css?v=1.1">
<link rel="stylesheet" href="./rank-background-fix.css?v=1.0">
<link rel="stylesheet" href="./punch-fix.css?v=1.2">
<link rel="stylesheet" href="./tap-size-fix.css?v=1.2">
<link rel="stylesheet" href="./authority-ui.css?v=1.8">
<link rel="stylesheet" href="./authority-folder.css?v=1.0">\n<link rel="stylesheet" href="./raids-ui.css?v=2.3">
<script src="/sdk.js"></script>
<script src="./js/yandex-sdk.js?v=1.3"></script>
<script src="./js/resource-branding.js?v=1.0"></script>
<script src="./js/authority-assets.js?v=1.0"></script>
</head>
<body>
<div id="preloader" aria-label="Загрузка игры"><picture><source media="(max-width:700px)" srcset="./assets/backgrounds/mobile/loading-mobile.jpg"><img id="preloader-bg" src="./assets/backgrounds/desktop/loading-desktop.jpg" alt="" aria-hidden="true"></picture><div id="preloader-content"><h1 id="preloader-title">АВТОРИТЕТ 2.0</h1><img id="preloader-handcuffs" src="./assets/backgrounds/handcuffs.png" alt="" aria-hidden="true"><div id="preloader-status">ПОДГОТАВЛИВАЕМ БАРАК</div><div id="preloader-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="preloader-progress"></span></div><div id="preloader-percent">0%</div></div></div>
<script src="./js/preloader.js?v=1.0"></script>
<div id="game-container" class="game-booting">
<header id="top-bar"><div class="resource">🍵 <span id="chifir">0</span></div><div class="resource">⭐ <span id="points">0</span></div><div class="resource energy" role="button" tabindex="0" aria-label="Энергия"><span class="energy-main">⚡ <span id="energy">250</span>/<span id="max-energy">250</span></span><small id="energy-hint" class="energy-hint" aria-live="polite"></small></div></header>
<div id="sentence-panel" class="sentence-panel" aria-live="polite"><div class="sentence-head"><span>⛓️ Срок</span><b id="sentence-left">100 дней</b></div><div class="sentence-track"><span id="sentence-fill"></span></div><small id="sentence-detail">Отбыл 0 / 100 дней</small></div><div id="rank-goal" class="rank-goal" aria-live="polite"><div class="rank-goal-head"><span id="rank-goal-label">До следующей масти</span><b id="rank-goal-value">0 / 500 ⭐</b></div><div class="rank-goal-track"><span id="rank-goal-fill"></span></div></div><section id="player-info"><div id="nickname-row"><span id="nickname">Салага</span><span id="test-version" title="Тестовая версия">TEST 085</span></div><div id="rank">Салага</div><div class="stats"><span>💪 <b id="power-stat">1</b></span><span>🧠 <b id="respect-stat">0</b></span><span>💰 <b id="wealth-stat">0</b></span></div></section>
<div id="jail-panel" class="hidden"><div class="jail-title">🔒 КАРЦЕР</div><div class="jail-counter"><b id="jail-count">0 / 500</b></div><div class="jail-text"><span id="jail-left">500</span> приседаний до выхода из карцера</div><div class="jail-confiscated">🍵 За отказ от работ могут изъять часть чефира</div></div>
<main id="tap-area"><div id="tap-object" class="tap-target preload-hidden"><div id="object-emoji"></div><div id="object-name">Груша</div><small id="object-action">ТАПАЙ!</small></div><div id="tap-feedback"></div></main>
<div id="event-message"></div><div id="choice-result" aria-live="polite"></div>
<footer id="bottom-bar"><button type="button" id="btn-shop" class="nav-btn">💪 Качалка</button><button type="button" id="btn-rank" class="nav-btn">🏆 Масть</button><button type="button" id="btn-tasks" class="nav-btn">🎯 Поручения</button><button type="button" id="btn-more" class="nav-btn">☰ Барак</button></footer>
<div id="modal-overlay" class="hidden"><div id="modal"><button type="button" id="modal-close">✕</button><div id="modal-content"></div></div></div>
</div>
<script src="./js/backgrounds-ui.js?v=1.0"></script>
<script defer src="./js/bootstrap.js?v=2.14"></script>
<script defer src="./js/energy-ui.js?v=1.0"></script>
<script defer src="./js/npc-motion.js?v=1.3"></script>\n<script defer src="./js/raids-ui.js?v=2.2"></script>
</body>
</html>
