<body>
<div id="app-root">
<div id="preloader" class="preloader" aria-live="polite">
<img id="preloader-bg" alt="" aria-hidden="true">
<div id="preloader-content">
<h1 id="preloader-title">АВТОРИТЕТ</h1>
<img id="preloader-handcuffs" src="./assets/backgrounds/handcuffs.webp" alt="Наручники">
<div id="preloader-status">Готовим зону...</div>
<div id="preloader-track" role="progressbar" aria-label="Загрузка игры" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="preloader-progress"></span></div>
<div id="preloader-percent">0%</div>
</div>
</div>
<div id="game-container" class="game-booting">
<header id="top-resources" class="top-resources" >
<div class="resource resource-chifir"><span class="resource-icon" aria-hidden="true">🍵</span><span class="resource-copy"><small>ЧЕФИР</small><b id="chifir">0</b></span></div>
<div class="resource resource-points"><span class="resource-icon" aria-hidden="true">⭐</span><span class="resource-copy"><small>ПОНТЫ</small><b id="points">0</b></span></div>
<div class="resource resource-energy energy" role="button" tabindex="0" aria-label="Энергия"><span class="resource-icon" aria-hidden="true">⚡</span><span class="resource-copy"><small>ЭНЕРГИЯ</small><b><span id="energy">0</span>/<span id="max-energy">0</span></b></span></div>
</header>
<div class="sentence-layout"><div id="sentence-panel" class="sentence-panel" aria-live="polite"><div class="sentence-head"><span>⛓️ Срок</span><b id="sentence-left">100 дней</b></div><div class="sentence-track-row"><div class="sentence-track"><span id="sentence-fill"></span></div></div><small id="sentence-detail">Отбыл 0 / 100 дней</small></div><button type="button" id="settings-gear-button" aria-label="Открыть настройки" title="Настройки">⚙</button></div>
<div id="rank-goal" class="rank-goal" aria-live="polite"><div class="rank-goal-head"><span id="rank-goal-label">До следующей масти</span><b id="rank-goal-value">0 / 900 ⭐</b></div><div class="rank-goal-track"><span id="rank-goal-fill"></span></div></div>
<section id="player-info"><div id="nickname-row"><span id="nickname">Салага</span><span id="test-version" aria-label="Тестовый режим" style="display:none"></span></div><div id="rank">Салага</div><div class="stats"><span>💪 <b id="power-stat">1</b></span><span>🧠 <b id="respect-stat">0</b></span><span>💰 <b id="wealth-stat">0</b></span></div></section>
<main id="tap-area" class="tap-area"><div id="object-name" class="object-name">Груша</div><button type="button" id="tap-object" class="tap-object" aria-label="Тапать"><span id="object-emoji" aria-hidden="true"></span></button><div id="object-action" class="object-action">ТАПАЙ!</div></main>
<div id="jail-panel" class="jail-panel hidden"><div class="jail-title">Карцер</div><div id="jail-count">0 / 500</div><div>Осталось: <span id="jail-left">500</span></div></div>
<div id="event-message" class="event-message" aria-live="polite"></div>
<nav id="bottom-nav" class="bottom-nav" aria-label="Меню">
<button type="button" id="btn-shop" class="nav-btn">Магаз</button>
<button type="button" id="btn-rank" class="nav-btn">Масть</button>
<button type="button" id="btn-tasks" class="nav-btn">Дела</button>
<button type="button" id="btn-more" class="nav-btn">Барак</button>
</nav>
</div>
<div id="modal-overlay" class="modal-overlay hidden" aria-hidden="true"><div id="modal" class="modal" role="dialog" aria-modal="true"><button type="button" id="modal-close" class="modal-close" aria-label="Закрыть">×</button><div id="modal-content" class="modal-content"></div></div></div>
</div>
