<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Авторитет 2.0</title>
<link rel="stylesheet" href="./style.css?v=3.6">
<link rel="stylesheet" href="./pc-responsive.css?v=1.0">
<link rel="stylesheet" href="./object-visuals.css?v=6?v=3.2">
<link rel="stylesheet" href="./energy-ui.css?v=1.0">
<link rel="stylesheet" href="./npc-barrack.css?v=1.2">
<link rel="stylesheet" href="./npc-image-fix.css?v=1.5">
<link rel="stylesheet" href="./npc-motion.css?v=1.3">
<link rel="stylesheet" href="./npc-dialogue-modern.css?v=1.8">
<link rel="stylesheet" href="./stats-cleanup.css?v=1.1">
<link rel="stylesheet" href="./rank-background-fix.css?v=1.0">
<link rel="stylesheet" href="./punch-fix.css?v=1.2">
<link rel="stylesheet" href="./tap-size-fix.css?v=1.1">
<link rel="stylesheet" href="./authority-ui.css?v=1.8">
<link rel="stylesheet" href="./authority-folder.css?v=1.0">
<script src="/sdk.js"></script>
<script src="./js/yandex-sdk.js?v=1.3"></script>
<script src="./js/resource-branding.js?v=1.0"></script>
<script src="./js/authority-assets.js?v=1.0"></script>
</head>
<body>
<div id="game-container" class="game-booting">
<header id="top-bar"><div class="resource">🍵 <span id="cigarettes">0</span></div><div class="resource">⭐ <span id="points">0</span></div><div class="resource energy">⚡ <span id="energy">250</span>/<span id="max-energy">250</span></div></header>
<section id="player-info"><div id="nickname-row"><span id="nickname">Салага</span><span id="test-version" title="Тестовая версия">TEST 068</span></div><div id="rank">Салага</div><div class="stats"><span>💪 <b id="power-stat">1</b></span><span>🧠 <b id="respect-stat">0</b></span><span>💰 <b id="wealth-stat">0</b></span></div></section>
<div id="jail-panel" class="hidden"><div class="jail-title">🔒 КАРЦЕР</div><div class="jail-counter"><b id="jail-count">0 / 500</b></div><div class="jail-text"><span id="jail-left">500</span> тапов до выхода из карцера</div><div class="jail-confiscated">🍵 За отказ от работ изымается 20% чефира</div></div>
<main id="tap-area"><div id="tap-object" class="tap-target preload-hidden"><div id="object-emoji"></div><div id="object-name">Груша</div><small id="object-action">ТАПАЙ!</small></div><div id="tap-feedback"></div></main>
<div id="event-message"></div><div id="choice-result" aria-live="polite"></div>
<footer id="bottom-bar"><button type="button" id="btn-shop" class="nav-btn">💪 Качалка</button><button type="button" id="btn-rank" class="nav-btn">🏆 Масть</button><button type="button" id="btn-tasks" class="nav-btn">🎯 Поручения</button><button type="button" id="btn-more" class="nav-btn">☰ Барак</button></footer>
<div id="modal-overlay" class="hidden"><div id="modal"><button type="button" id="modal-close">✕</button><div id="modal-content"></div></div></div>
</div>
<script src="./js/backgrounds-ui.js?v=1.0"></script>
<script defer src="./js/bootstrap.js?v=2.8"></script>
<script defer src="./js/energy-ui.js?v=1.0"></script>
<script defer src="./js/npc-motion.js?v=1.3"></script>
</body>
</html>
